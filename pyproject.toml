[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colmap-video-toolkit"
version = "0.1.0"
description = "Turn a hand-held video into a clean COLMAP reconstruction for NeRF / 3D Gaussian Splatting"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rung-Chi Lin"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "opencv-python-headless>=4.6", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cvt = "colmap_video_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["colmap_video_toolkit*"]
